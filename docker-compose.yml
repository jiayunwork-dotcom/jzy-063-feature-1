services:
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres
    environment:
      POSTGRES_USER: config
      POSTGRES_PASSWORD: config
      POSTGRES_DB: configdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config -d configdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cc-backend
    environment:
      DATABASE_DSN: "postgres://config:config@postgres:5432/configdb?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      HTTP_ADDR: ":8080"
      SCHEMA_DIR: "/app/db"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cc-frontend
    depends_on:
      - backend
    ports:
      - "8000:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
